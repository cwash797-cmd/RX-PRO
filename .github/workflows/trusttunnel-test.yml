name: TrustTunnel TEST arm64
on:
  push:
    branches: [feature/trusttunnel-test, fix/trusttunnel-reliability]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trusttunnel-test-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      nkmr_minify: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: |
            trusttunnel-core/go.sum
            libcore/go.sum
      - name: Verify isolated TEST identity and fixed toolchain
        run: |
          grep -qx 'PACKAGE_NAME=com.rixxx.rxpro.tttest' nb4a.properties
          grep -q 'VERSION_NAME=.*tt-test' nb4a.properties
          # Hosted runner images rotate SDKs; provision ONLY the fixed versions
          # on the ephemeral GitHub runner (the development sandbox is unchanged).
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;27.0.12077973' 'build-tools;35.0.0' 'platforms;android-35'
          test -d "$ANDROID_HOME/ndk/27.0.12077973"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Protocol tests (synthetic credentials only)
        working-directory: trusttunnel-core
        run: go test -race -timeout 90s -v ./...
      - name: Build unchanged pinned libcore
        run: ./run lib core
      - name: Build TrustTunnel and fetch existing pinned plugins
        run: |
          bash trusttunnel-core/build-android.sh
          bash buildScript/lib/plugins.sh
          bash buildScript/lib/assets.sh
      - name: Test and build signed TEST APK
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          test -n "$LOCAL_PROPERTIES"
          ./gradlew :app:testOssDebugUnitTest :app:assembleOssRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -XX:ActiveProcessorCount=2' -Pkotlin.compiler.execution.strategy=in-process --console=plain
          mkdir -p test-dist
          APK=$(find app/build/outputs/apk/oss/release -name '*arm64-v8a*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libtrusttunnel.so'
          cp "$APK" test-dist/
          cd test-dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RX-PRO-TrustTunnel-TEST-arm64
          path: test-dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TrustTunnel-test-reports
          path: app/build/reports/tests/
# Intentionally no release publishing: stable 1.5.1 must remain Latest.
