name: Android arm64 Build
on:
  push:
    branches: [main, release/1.5.5]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: android-build-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      nkmr_minify: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: |
            trusttunnel-core/go.sum
            libcore/go.sum
      - name: Verify identity and fixed Android toolchain
        run: |
          grep -qx 'PACKAGE_NAME=com.rixxx.rxpro' nb4a.properties
          grep -Eq '^VERSION_NAME=[0-9]+\.[0-9]+\.[0-9]+$' nb4a.properties
          # Provision fixed SDK versions on the ephemeral GitHub runner only.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;27.0.12077973' 'build-tools;35.0.0' 'platforms;android-35'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Protocol regression tests
        working-directory: trusttunnel-core
        run: go test -race -timeout 90s -v ./...
      - name: Build pinned libcore
        run: ./run lib core
      - name: Build TrustTunnel and fetch pinned plugins
        run: |
          bash trusttunnel-core/build-android.sh
          bash buildScript/lib/plugins.sh
          bash buildScript/lib/assets.sh
      - name: Verify tests and build signed APK
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          test -n "$LOCAL_PROPERTIES"
          ./gradlew :app:testOssDebugUnitTest :app:assembleOssRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -XX:ActiveProcessorCount=2' -Pkotlin.compiler.execution.strategy=in-process --console=plain
          mkdir -p test-dist
          APK=$(find app/build/outputs/apk/oss/release -name '*arm64-v8a*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "name='com.rixxx.rxpro'"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libtrusttunnel.so'
          cp "$APK" test-dist/
          cd test-dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RX-PRO-arm64
          path: test-dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-regression-reports
          path: app/build/reports/tests/
